# CI/CD for fvutils/sphinx-systemverilog on Forgejo Actions.
#
# Deliberately smaller than .github/workflows/ci.yml: this is the release path.
# Three differences from the GitHub workflow, each intentional:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com, so fvutils/ivpm-setup and
#     pypa/gh-action-pypi-publish are unavailable here. Dependencies come from
#     PyPI via pip and publishing is plain `twine`, which keeps GitHub off the
#     critical path of a release.
#  2. Only the unit and sphinx tests run. The corpus tests need the UVM tarball,
#     which is an ivpm dependency; GitHub Actions still covers those nightly.
#  3. Releases are tag-driven. A `v<version>` tag is the deliberate act; pushes
#     to main build and test, but their dev-suffixed artifacts never reach PyPI.
#  4. Docs are published as an artifact, not pushed to a gh-pages branch. Built
#     HTML is a build output, never a git branch -- see
#     ~/Documents/dvkit-docs-publishing-design.md F2 and section 5.8. A host-side
#     poller picks up `docs-fvutils-sphinx-systemverilog` and stages it for
#     review; nothing here can reach dvkit.org on its own.
name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong here in both directions: a tag push IS a push, so it would
            # let a release through unresolved, and every ordinary push would
            # then also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up a build environment
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --upgrade pip build twine
          /tmp/venv/bin/pip install -q ".[dev]"

      - name: Run unit and integration tests
        run: /tmp/venv/bin/python -m pytest -m "unit or sphinx" -q

      - name: Stamp build version
        # Tag builds keep the clean BASE version; everything else gets a
        # .<run-id> dev suffix so an ordinary push can never produce a wheel
        # whose version could collide with a release on PyPI.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "tag build -- leaving version clean" ;;
            *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' \
                 src/sphinx_systemverilog/__version__.py ;;
          esac
          grep '^SUFFIX = ' src/sphinx_systemverilog/__version__.py

      - name: Build sdist and wheel
        run: |
          rm -rf dist/
          /tmp/venv/bin/python -m build .
          /tmp/venv/bin/twine check dist/*
          ls -la dist/

      - name: Upload distributions
        uses: forgejo/upload-artifact@v4
        with:
          name: dist-sphinx-systemverilog
          path: dist/*
          if-no-files-found: error

  docs:
    # Builds against the installed wheel, not the source tree: conf.py loads the
    # extension by name, so what gets documented is the artifact we ship.
    #
    # The UVM sources come from ivpm, exactly as they do for a developer working
    # in this tree. Without them conf.py falls back to the fixtures and the whole
    # UVM reference renders empty -- a quietly reduced doc set, which is what the
    # coverage check below turns into a hard failure.
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install graphviz
        # Inheritance and instance diagrams render through sphinx.ext.graphviz,
        # which shells out to `dot`. Without it Sphinx emits a warning and drops
        # every diagram, so this is a build dependency, not a nicety.
        run: |
          apt-get update -qq && apt-get install -y -qq graphviz
          dot -V

      - name: Download distributions
        uses: forgejo/download-artifact@v4
        with:
          name: dist-sphinx-systemverilog
          path: dist

      - name: Fetch dependencies with ivpm
        # `ivpm update` builds packages/python from ivpm.yaml and unpacks the UVM
        # release into packages/uvm, which is the path conf.py probes.
        run: |
          python3 -m pip install -q --upgrade pip ivpm
          python3 -m ivpm update
          test -f packages/uvm/src/uvm_pkg.sv

      - name: Build HTML docs
        # Installing the wheel replaces the editable install ivpm made, so the
        # extension under test is the packaged one; the import check asserts that
        # rather than assuming pip's uninstall step worked.
        run: |
          ./packages/python/bin/pip install -q --force-reinstall --no-deps dist/*.whl
          ./packages/python/bin/python -c "
          import sphinx_systemverilog as m, sys
          print('extension:', m.__file__, m.__version__)
          sys.exit(0 if 'site-packages' in m.__file__ else 'built wheel is being shadowed by the source tree')
          "
          ./packages/python/bin/python -m sphinx -W --keep-going -b html docs docs/_build/html 2>&1 | tee /tmp/sphinx.log
          touch docs/_build/html/.nojekyll
          rm -rf docs/_build/html/.doctrees docs/_build/doctrees

      - name: Report the build
        # -W above already fails the build on any warning; this is here so the
        # log says how much was produced, which is the number that moves when a
        # scoping pattern silently stops matching.
        run: |
          echo "generated pages: $(find docs/_build/html -name '*.html' | wc -l)"
          grep -E "WARNING|ERROR" /tmp/sphinx.log | head -5 || true

      - name: Check every documented class reached a page
        # The UVM reference splits 288 classes across pages by source path.
        # Nothing in Sphinx notices when a class falls between two of those
        # patterns -- the build succeeds and the class is simply gone -- so
        # compare the parsed index against the published objects.inv. This also
        # fails closed if the UVM sources never reached the build at all, since
        # then every reference page renders empty.
        run: |
          ./packages/python/bin/python scripts/check-docs-coverage.py \
            --html docs/_build/html --uvm packages/uvm/src
          test -d docs/_build/html/_images || { echo "::error::no diagrams were rendered"; exit 1; }
          echo "diagrams: $(ls docs/_build/html/_images | wc -l)"

      - name: Upload docs
        # Consumed by the host-side docs staging poller; the artifact name follows
        # the <org>-<repo> convention that design depends on.
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-fvutils-sphinx-systemverilog
          path: docs/_build/html/**
          if-no-files-found: error

  publish-pypi:
    # Releases only. A version number on PyPI can be yanked but never reused.
    # SWITCH ADDED 2026-08-31 (wave 3b). The tag clause was already here and is
    # unchanged; what is new is the release-authority check.
    #
    # THIS IS A REAL PUBLISHER, not a shadow. It is the pipeline that actually
    # releases this package: the versions on PyPI correspond to `v*` tags that exist
    # in Forgejo and return 404 on GitHub, so this side has been the release
    # authority in practice for some time. `sync-policy.toml` now says so explicitly
    # rather than leaving it as an accident of which forge happened to hold the tag.
    #
    # WHY THE SWITCH MATTERS MORE HERE THAN ANYWHERE ELSE IN THE ESTATE. Until
    # fvutils entered sync this repository only ever received tags a human pushed.
    # It now also receives them from GitHub, on a five-minute cron -- and a tag
    # arriving that way would have run this job and uploaded to PyPI. `authority`
    # is what makes "which forge may publish" a single decision in a single place
    # instead of a property of whichever forge a tag reached first.
    if: >-
      needs.gate.outputs.authority == 'forgejo' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [gate, build, docs]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: forgejo/download-artifact@v4
        with:
          name: dist-sphinx-systemverilog
          path: dist

      - name: Check the tag matches the package version
        # Guards against tagging v0.2.0 while __version__.py still says 0.1.0,
        # which would publish a release under the wrong number, unfixably.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          base=$(grep '^BASE = ' src/sphinx_systemverilog/__version__.py | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag  BASE=$base"
          if [ "$tag" != "$base" ]; then
            echo "::error::tag v$tag does not match BASE $base in src/sphinx_systemverilog/__version__.py"
            exit 1
          fi
          for f in dist/*; do
            case "$(basename "$f")" in
              sphinx_systemverilog-${base}-*.whl|sphinx_systemverilog-${base}.tar.gz) ;;
              *) echo "::error::artifact $(basename "$f") is not version ${base}"; exit 1 ;;
            esac
          done
          echo "OK: tag, source version and all artifacts agree on ${base}"

      - name: Publish to PyPI
        # Plain twine rather than a third-party action: this is the release
        # path, and it should not depend on GitHub being reachable.
        # PYPI_API_TOKEN is an organization secret on fvutils.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_API_TOKEN is not visible to this repository"
            exit 1
          fi
          python3 -m venv /tmp/twineenv
          /tmp/twineenv/bin/pip install -q --upgrade pip twine
          /tmp/twineenv/bin/twine check dist/*
          /tmp/twineenv/bin/twine upload --non-interactive --skip-existing dist/*
          echo "published $(ls dist/ | wc -l) artifacts"
