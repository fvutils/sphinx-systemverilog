name: CI

on:
  push:
    branches: [main]
    # TAGS ADDED 2026-09-09, and they are load-bearing: without this the `v*`
    # tag that releases this package did not trigger this workflow at all, so
    # the publish job below could never have fired no matter what the switch
    # said.
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly: also run the slow UVM corpus smoke tests.
    - cron: "0 5 * * *"

jobs:
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so `publish-pypi` below declares it.
  #
  # Deliberately a copy of the .forgejo workflow's `gate` rather than a shared
  # definition: the two forges cannot reference a common file, and a gate that
  # silently stopped matching its counterpart is the failure this whole
  # mechanism exists to prevent.
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable on a non-tag ref; nothing to release"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Graphviz (for inheritance diagrams in the docs build)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # Fetch dependencies (including the UVM sources) into ./packages so the
      # docs build renders the live UVM reference and corpus tests have UVM.
      - uses: fvutils/ivpm-setup@v1
        with:
          python-version: ${{ matrix.python-version }}
          args: "-a"

      - name: Install package (editable) into the ivpm environment
        run: ./packages/python/bin/python -m pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: ./packages/python/bin/python -m pytest -m "unit or sphinx" -q

      - name: Build documentation (warnings as errors, live UVM reference)
        run: ./packages/python/bin/python -m sphinx -W -b html docs docs/_build/html

  # The GitHub Pages deploy step WAS HERE and is deliberately gone (2026-08-31).
  #
  # It had no condition beyond the default branch, and since fvutils joined the
  # Forgejo <-> GitHub mirror that branch is moved by a five-minute cron. A mirror
  # operation must never be a publishing operation.
  #
  # DELETED rather than gated because dvkit.org owns all documentation: these docs
  # publish to dvkit.org/fvutils/<repo>/ from .forgejo/workflows/, which uploads
  # them as an artifact for the host-side poller. A tag-gated Pages deploy would
  # still be a second publisher of the same content on a different schedule, and
  # two publishers that agree today diverge the first time one fails quietly.
  #
  # THE DOCS BUILD ABOVE STAYS, as a CI check. A broken cross-reference should fail
  # here, not render as a dead link on dvkit.org.


  corpus:
    # Slow corpus smoke test (parses the full UVM library); nightly only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: fvutils/ivpm-setup@v1
        with:
          python-version: "3.12"
          args: "-a"

      - name: Install package (editable) into the ivpm environment
        run: ./packages/python/bin/python -m pip install -e ".[dev]"

      - name: Corpus smoke tests (UVM)
        run: ./packages/python/bin/python -m pytest -m corpus -q

  publish-pypi:
    # ADDED 2026-09-09, so that release authority for this repo can move to
    # "github" in sync-policy.toml. This repo was pinned to "forgejo" for the
    # only reason that mattered: the .forgejo pipeline was the only publisher it
    # had, so the estate default of "github" would have left it with no release
    # path at all -- a tag pushed, nothing published, and nothing red.
    #
    # BOTH CLAUSES ARE LOAD-BEARING.
    #
    #   refs/tags/v*   this repo is mirrored to Forgejo and back on a five-minute
    #                  cron, and git-sync moves the DEFAULT BRANCH. A branch-gated
    #                  publisher is therefore satisfied by a sync cycle -- mirroring
    #                  would be a release trigger. A tag is a deliberate act; a
    #                  cycle never creates one.
    #
    #   authority      the release-authority master switch. Its counterpart in
    #                  .forgejo/workflows/ci.yml tests for 'forgejo', so exactly
    #                  one of the two can fire for any given tag. Both forges
    #                  receive every tag, so without this they would race, and on
    #                  PyPI a version can be yanked but never reused.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.gate.outputs.authority == 'github'
    needs: [gate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        # No version stamping: this job only ever runs on a tag, where the
        # .forgejo side deliberately leaves the version clean too.
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist/
          python -m build .
          python -m twine check dist/*

      - name: Check the tag matches the package version
        # Guards against tagging v0.2.0 while __version__.py still says 0.1.0,
        # which would publish a release under the wrong number, unfixably.
        # Identical check to the .forgejo side, deliberately: whichever forge
        # holds authority, the same guarantee has to hold.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          base=$(grep '^BASE = ' src/sphinx_systemverilog/__version__.py | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag  BASE=$base"
          if [ "$tag" != "$base" ]; then
            echo "::error::tag v$tag does not match BASE $base in src/sphinx_systemverilog/__version__.py"
            exit 1
          fi
          for f in dist/*; do
            case "$(basename "$f")" in
              sphinx_systemverilog-${base}-*.whl|sphinx_systemverilog-${base}.tar.gz) ;;
              *) echo "::error::artifact $(basename "$f") is not version ${base}"; exit 1 ;;
            esac
          done
          echo "OK: tag, source version and all artifacts agree on ${base}"

      - name: Publish to PyPI
        # Plain twine rather than pypa/gh-action-pypi-publish, matching the
        # .forgejo side step for step. PYPI_API_TOKEN is an organization secret
        # on fvutils.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_API_TOKEN is not visible to this repository"
            exit 1
          fi
          python -m pip install --upgrade twine
          python -m twine check dist/*
          # Idempotence net: with one switch and two possible publishers, a
          # misconfiguration should cost a no-op rather than a hard failure.
          python -m twine upload --non-interactive --skip-existing dist/*
          echo "published $(ls dist/ | wc -l) artifacts"
