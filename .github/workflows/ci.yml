name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: also run the slow UVM corpus smoke tests.
    - cron: "0 5 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Graphviz (for inheritance diagrams in the docs build)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # Fetch dependencies (including the UVM sources) into ./packages so the
      # docs build renders the live UVM reference and corpus tests have UVM.
      - uses: fvutils/ivpm-setup@v1
        with:
          python-version: ${{ matrix.python-version }}
          args: "-a"

      - name: Install package (editable) into the ivpm environment
        run: ./packages/python/bin/python -m pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: ./packages/python/bin/python -m pytest -m "unit or sphinx" -q

      - name: Build documentation (warnings as errors, live UVM reference)
        run: ./packages/python/bin/python -m sphinx -W -b html docs docs/_build/html

  # The GitHub Pages deploy step WAS HERE and is deliberately gone (2026-08-31).
  #
  # It had no condition beyond the default branch, and since fvutils joined the
  # Forgejo <-> GitHub mirror that branch is moved by a five-minute cron. A mirror
  # operation must never be a publishing operation.
  #
  # DELETED rather than gated because dvkit.org owns all documentation: these docs
  # publish to dvkit.org/fvutils/<repo>/ from .forgejo/workflows/, which uploads
  # them as an artifact for the host-side poller. A tag-gated Pages deploy would
  # still be a second publisher of the same content on a different schedule, and
  # two publishers that agree today diverge the first time one fails quietly.
  #
  # THE DOCS BUILD ABOVE STAYS, as a CI check. A broken cross-reference should fail
  # here, not render as a dead link on dvkit.org.


  corpus:
    # Slow corpus smoke test (parses the full UVM library); nightly only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: fvutils/ivpm-setup@v1
        with:
          python-version: "3.12"
          args: "-a"

      - name: Install package (editable) into the ivpm environment
        run: ./packages/python/bin/python -m pip install -e ".[dev]"

      - name: Corpus smoke tests (UVM)
        run: ./packages/python/bin/python -m pytest -m corpus -q
